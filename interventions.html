<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Interventions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .timeline-container { position: relative; max-width: 800px; margin: 0 auto; padding: 20px 0; }
        .timeline-line { position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: #e2e8f0; }
        
        .event-item { position: relative; padding-left: 50px; margin-bottom: 40px; }
        .event-dot { 
            position: absolute; left: 11px; top: 0; width: 20px; height: 20px; 
            background: #0f172a; border-radius: 50%; border: 4px solid #f8fafc; z-index: 10;
        }
        
        .event-date { font-weight: 700; color: #64748b; font-size: 0.9rem; margin-bottom: 5px; }
        .event-title { font-size: 1.3rem; font-weight: 700; color: #0f172a; margin: 0 0 5px 0; line-height: 1.3; }
        .event-meta { font-size: 0.9rem; color: #3b82f6; font-weight: 600; margin-bottom: 10px; }
        .event-desc { color: #475569; line-height: 1.6; margin-bottom: 15px; }
        
        .event-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.9rem; font-weight: 600; color: #0f172a; text-decoration: none; border-bottom: 1px solid transparent;
        }
        .event-link:hover { border-bottom-color: #0f172a; }

        .empty-msg { text-align: center; color: #94a3b8; font-style: italic; margin-top: 4rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="header-logo">MON SITE</div>
        <nav>
            <ul id="header-menu" class="dynamic-nav"></ul>
        </nav>
    </header>

    <div class="container">
        <div style="width: 100%;">
            <h1 style="text-align: center; margin-bottom: 1rem;">Interventions & Colloques</h1>
            <p style="text-align: center; color: #64748b; margin-bottom: 3rem;">Conférences, séminaires et prises de parole.</p>
            
            <div id="timeline-box">
                <p class="empty-msg">Chargement...</p>
            </div>
        </div>
    </div>

    <footer>
        <p>© <span id="current-year"></span> <span id="footer-name"></span></p>
        <nav>
            <ul id="footer-menu" class="dynamic-nav"></ul>
        </nav>
    </footer>

    <script>
        const SUPABASE_URL = 'https://recgvfcuxsonkhlyctrw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MS-dVMY2bgi4ljM4tDTIdg_t4YKb80o';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const profParam = params.get('prof');
            if (!profParam) { document.body.innerHTML = "<div style='padding:50px;text-align:center;'>Profil introuvable.</div>"; return; }

            let query = sb.from('profiles').select('*, interventions(*)');
            const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(profParam);
            query = isUUID ? query.eq('id', profParam) : query.eq('slug', profParam);

            const { data: profile, error } = await query.single();

            if (error || !profile) { document.body.innerHTML = "<div style='padding:50px;text-align:center;'>Profil introuvable.</div>"; return; }

            // Identité
            document.title = `Interventions - ${profile.name}`;
            document.getElementById('header-logo').textContent = (profile.name).toUpperCase();
            document.getElementById('footer-name').textContent = profile.name;
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // Menu
            const pLink = `?prof=${profParam}`;
            const conf = profile.config || {};
            const h = conf.header || {};
            let hHtml = '';
            if (h.home) hHtml += `<li><a href="index.html${pLink}">Accueil</a></li>`;
            if (h.publications) hHtml += `<li><a href="publications.html${pLink}">Publications</a></li>`;
            if (h.courses) hHtml += `<li><a href="cours.html${pLink}">Enseignements</a></li>`;
            if (h.interventions) hHtml += `<li><a href="interventions.html${pLink}" style="color:white;">Interventions</a></li>`;
            document.getElementById('header-menu').innerHTML = hHtml;

            const f = conf.footer || {};
            let fHtml = '';
            if (f.linkedin && profile.linkedin_url) fHtml += `<li><a href="${profile.linkedin_url}" target="_blank"><i data-lucide="linkedin"></i></a></li>`;
            if (f.scholar && profile.scholar_url) fHtml += `<li><a href="${profile.scholar_url}" target="_blank"><i data-lucide="graduation-cap"></i></a></li>`;
            if (f.cv && profile.cv_url) fHtml += `<li><a href="${profile.cv_url}" target="_blank"><i data-lucide="file-text"></i></a></li>`;
            document.getElementById('footer-menu').innerHTML = fHtml;

            // Affichage Timeline
            const container = document.getElementById('timeline-box');
            const items = profile.interventions || [];

            if (items.length === 0) {
                container.innerHTML = "<p class='empty-msg'>Aucune intervention pour le moment.</p>";
                return;
            }

            // Tri date
            items.sort((a, b) => new Date(b.event_date) - new Date(a.event_date));

            let html = '<div class="timeline-container"><div class="timeline-line"></div>';
            
            items.forEach(item => {
                const dateStr = item.event_date ? new Date(item.event_date).toLocaleDateString('fr-FR', {year: 'numeric', month: 'long', day: 'numeric'}) : 'Date inconnue';
                const locationStr = item.location ? `• ${item.location}` : '';
                
                let linkHtml = '';
                if(item.link_value) {
                    const label = item.link_type === 'file' ? 'Télécharger le support' : 'Voir le lien';
                    linkHtml = `<a href="${item.link_value}" target="_blank" class="event-link"><i data-lucide="link" size="14"></i> ${label}</a>`;
                }

                html += `
                    <div class="event-item">
                        <div class="event-dot"></div>
                        <div class="event-date">${dateStr}</div>
                        <h3 class="event-title">${item.title}</h3>
                        <div class="event-meta">${item.category || 'Conférence'} ${locationStr}</div>
                        <p class="event-desc">${item.description || ''}</p>
                        ${linkHtml}
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
            lucide.createIcons();
        }

        init();
    </script>
</body>
</html>
