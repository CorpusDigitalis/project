<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Corpus Digitalis Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-body: #f8fafc; 
            --accent: #0f172a; 
            --accent-light: #1e293b;
            --text-main: #334155; 
            --text-muted: #64748b; 
            --border: #e2e8f0; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-body); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: var(--text-main); 
        }
        
        .login-card { 
            background: white; 
            padding: 45px 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.02); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border: 1px solid var(--border);
            box-sizing: border-box;
        }
        
        .logo-text { 
            font-weight: 800; font-size: 1.1rem; text-transform: uppercase; 
            letter-spacing: 0.05em; display: flex; align-items: center; 
            justify-content: center; gap: 8px; margin-bottom: 35px; color: var(--accent);
        }
        .logo-text span { background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; }
        
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; margin-top: 0; letter-spacing: -0.02em; color: var(--accent); }
        p.subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 30px; margin-top: 0; }
        
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: var(--text-muted); letter-spacing: 0.05em; }
        
        input { 
            width: 100%; padding: 12px 15px; border: 1px solid var(--border); 
            border-radius: 8px; box-sizing: border-box; font-family: inherit; 
            font-size: 0.95rem; transition: 0.2s; background: #fff; color: var(--text-main);
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 1px var(--accent); }
        input::placeholder { color: #cbd5e1; }
        
        .btn-primary { 
            background: var(--accent); color: white; border: none; width: 100%; 
            padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; 
            transition: 0.2s; font-size: 0.95rem; display: flex; align-items: center; 
            justify-content: center; gap: 8px; margin-top: 10px;
        }
        .btn-primary:hover:not(:disabled) { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        .link-btn { background: none; border: none; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; margin-top: 20px; transition: 0.2s; font-weight: 500; }
        .link-btn:hover { color: var(--accent); text-decoration: underline; }

        .hidden { display: none !important; }
        
        .alert { padding: 12px 15px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 25px; text-align: left; display: none; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .alert.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert.success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-text">CORPUS DIGITALIS <span>PRO</span></div>

    <div id="alert-box" class="alert hidden"></div>

    <div id="section-login">
        <h1>Bon retour</h1>
        <p class="subtitle">Connectez-vous à votre espace d'administration.</p>
        
        <form id="form-login">
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" placeholder="professeur@universite.fr" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="btn-login">
                Se connecter <i data-lucide="arrow-right" size="18"></i>
            </button>
        </form>
        
        <button class="link-btn" onclick="switchSection('reset-request')">Mot de passe oublié ?</button>
    </div>

    <div id="section-reset-request" class="hidden">
        <h1>Récupération</h1>
        <p class="subtitle">Recevez un lien de réinitialisation par email.</p>
        
        <form id="form-reset-request">
            <div class="form-group">
                <label for="reset-email">Adresse email</label>
                <input type="email" id="reset-email" placeholder="professeur@universite.fr" required>
            </div>
            <button type="submit" class="btn-primary" id="btn-reset">
                Envoyer le lien <i data-lucide="mail" size="18"></i>
            </button>
        </form>
        
        <button class="link-btn" onclick="switchSection('login')"><i data-lucide="arrow-left" size="14" style="vertical-align: middle;"></i> Retour à la connexion</button>
    </div>

    <div id="section-new-password" class="hidden">
        <h1>Sécurité</h1>
        <p class="subtitle">Définissez votre nouveau mot de passe.</p>
        
        <form id="form-new-password">
            <div class="form-group">
                <label for="new-password">Nouveau mot de passe</label>
                <input type="password" id="new-password" placeholder="Minimum 6 caractères" required minlength="6">
            </div>
            <button type="submit" class="btn-primary" id="btn-new-pwd">
                Sauvegarder <i data-lucide="check" size="18"></i>
            </button>
        </form>
    </div>
</div>

<script>
    // Initialisation des icônes
    lucide.createIcons();

    // Connexion Supabase (Script classique pour éviter les erreurs CORS locales)
    const SUPABASE_URL = 'https://recgvfcuxsonkhlyctrw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlY2d2ZmN1eHNvbmtobHljdHJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MTY5OTAsImV4cCI6MjA4MjM5Mjk5MH0.NrEoz7TiMDShWJ1pb2jTHgnItJgSSh1SFb5Q2X7zsjE'; 
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- AUTO-REDIRECTION (Si déjà connecté) ---
    async function checkSession() {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
            window.location.href = 'admin.html';
        }
    }
    checkSession();

    // --- GESTION DU ROUTAGE (Hash URL pour le reset) ---
    window.onload = () => {
        const hash = window.location.hash;
        if (hash.includes('type=recovery') || hash.includes('access_token')) {
            switchSection('new-password');
            showAlert("🔓 Vous pouvez définir un nouveau mot de passe.", "success", "unlock");
        }
    };

    // --- 1. CONNEXION ---
    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true, 'btn-login');
        
        const { error } = await sb.auth.signInWithPassword({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        });

        if (error) {
            showAlert("Email ou mot de passe incorrect.", "error", "alert-circle");
            setLoading(false, 'btn-login', 'Se connecter <i data-lucide="arrow-right" size="18"></i>');
        } else {
            window.location.href = 'admin.html';
        }
    });

    // --- 2. DEMANDE DE RESET ---
    document.getElementById('form-reset-request').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true, 'btn-reset');
        const email = document.getElementById('reset-email').value;
        
        const { error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + window.location.pathname, // Redirection propre
        });

        if (error) {
            showAlert("Erreur : " + error.message, "error", "alert-circle");
            setLoading(false, 'btn-reset', 'Envoyer le lien <i data-lucide="mail" size="18"></i>');
        } else {
            showAlert("Lien envoyé ! Vérifiez vos spams.", "success", "check-circle");
            document.getElementById('form-reset-request').reset();
            setLoading(false, 'btn-reset', 'Envoyer le lien <i data-lucide="mail" size="18"></i>');
        }
    });

    // --- 3. SAUVEGARDE NOUVEAU MDP ---
    document.getElementById('form-new-password').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true, 'btn-new-pwd');
        
        const { error } = await sb.auth.updateUser({
            password: document.getElementById('new-password').value
        });

        if (error) {
            showAlert("Erreur : " + error.message, "error", "alert-circle");
            setLoading(false, 'btn-new-pwd', 'Sauvegarder <i data-lucide="check" size="18"></i>');
        } else {
            showAlert("Mot de passe changé ! Redirection...", "success", "check-circle");
            setTimeout(() => window.location.href = 'admin.html', 1500);
        }
    });

    // --- UTILITAIRES ---
    window.switchSection = (id) => {
        ['login', 'reset-request', 'new-password'].forEach(s => {
            document.getElementById('section-' + s).classList.add('hidden');
        });
        document.getElementById('section-' + id).classList.remove('hidden');
        const alertBox = document.getElementById('alert-box');
        alertBox.classList.add('hidden');
        alertBox.style.display = 'none';
    }

    function showAlert(msg, type, iconName) {
        const el = document.getElementById('alert-box');
        el.innerHTML = `<i data-lucide="${iconName}" size="18"></i> ${msg}`;
        el.className = `alert ${type}`;
        el.style.display = 'flex';
        lucide.createIcons();
    }

    function setLoading(isLoading, btnId, defaultHTML = '') {
        const btn = document.getElementById(btnId);
        if (isLoading) {
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="spin"></i> Chargement...`;
        } else {
            btn.disabled = false;
            btn.innerHTML = defaultHTML;
        }
        lucide.createIcons();
    }
</script>
</body>
</html>
