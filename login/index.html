<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Corpus Digitalis Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #fafaf8;
            --accent: #0f172a;
            --accent-light: #1e293b;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e8e4de;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        /* Fond subtil avec texture papier légère */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(15,23,42,0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(15,23,42,0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-card {
            background: white;
            padding: 50px 45px;
            border-radius: 16px;
            box-shadow:
                0 1px 2px rgba(0,0,0,0.04),
                0 8px 24px rgba(0,0,0,0.06),
                0 32px 64px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid var(--border);
            border-top: 3px solid var(--accent);
            box-sizing: border-box;
            position: relative;
        }

        .logo-text {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--accent);
        }
        .logo-text span {
            background: var(--accent);
            color: white;
            padding: 3px 7px;
            border-radius: 3px;
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .logo-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 24px 0 30px 0;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            margin-top: 0;
            letter-spacing: -0.01em;
            color: var(--accent);
            line-height: 1.2;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 32px;
            margin-top: 0;
            line-height: 1.6;
        }

        .form-group { text-align: left; margin-bottom: 18px; }
        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--text-muted);
            letter-spacing: 0.06em;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fdfcfb;
            color: var(--text-main);
        }
        input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 2px rgba(15,23,42,0.08);
            background: #fff;
        }
        input::placeholder { color: #b8b4ac; }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--accent-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.2);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }

        .link-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.82rem;
            cursor: pointer;
            margin-top: 20px;
            transition: color 0.2s;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }
        .link-btn:hover { color: var(--accent); text-decoration: underline; }

        .hidden { display: none !important; }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: left;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; }

        .footer-note {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: #b8b4ac;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-text">CORPUS DIGITALIS <span>PRO</span></div>
    <hr class="logo-divider">

    <div id="alert-box" class="alert hidden"></div>

    <div id="section-login">
        <h1>Bon retour</h1>
        <p class="subtitle">Connectez-vous à votre espace d'administration.</p>

        <form id="form-login">
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" placeholder="professeur@universite.fr" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="btn-login">
                Se connecter <i data-lucide="arrow-right" size="16"></i>
            </button>
        </form>

        <button class="link-btn" onclick="switchSection('reset-request')">Mot de passe oublié ?</button>
    </div>

    <div id="section-reset-request" class="hidden">
        <h1>Récupération</h1>
        <p class="subtitle">Recevez un lien de réinitialisation par email.</p>

        <form id="form-reset-request">
            <div class="form-group">
                <label for="reset-email">Adresse email</label>
                <input type="email" id="reset-email" placeholder="professeur@universite.fr" required>
            </div>
            <button type="submit" class="btn-primary" id="btn-reset">
                Envoyer le lien <i data-lucide="mail" size="16"></i>
            </button>
        </form>

        <button class="link-btn" onclick="switchSection('login')"><i data-lucide="arrow-left" size="14" style="vertical-align: middle;"></i> Retour à la connexion</button>
    </div>

    <div id="section-new-password" class="hidden">
        <h1>Sécurité</h1>
        <p class="subtitle">Définissez votre nouveau mot de passe.</p>

        <form id="form-new-password">
            <div class="form-group">
                <label for="new-password">Nouveau mot de passe</label>
                <input type="password" id="new-password" placeholder="Minimum 6 caractères" required minlength="6">
            </div>
            <button type="submit" class="btn-primary" id="btn-new-pwd">
                Sauvegarder <i data-lucide="check" size="16"></i>
            </button>
        </form>
    </div>

    <div class="footer-note">Corpus Digitalis &mdash; Hub académique premium</div>
</div>

<script>
    // Initialisation des icônes
    lucide.createIcons();

    // Connexion Supabase (Script classique pour éviter les erreurs CORS locales)
    const SUPABASE_URL = 'https://recgvfcuxsonkhlyctrw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlY2d2ZmN1eHNvbmtobHljdHJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MTY5OTAsImV4cCI6MjA4MjM5Mjk5MH0.NrEoz7TiMDShWJ1pb2jTHgnItJgSSh1SFb5Q2X7zsjE';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- AUTO-REDIRECTION (Si déjà connecté) ---
    async function checkSession() {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
            window.location.href = '/admin/';
        }
    }
    checkSession();

    // --- GESTION DU ROUTAGE (Hash URL pour le reset) ---
    window.onload = () => {
        const hash = window.location.hash;
        if (hash.includes('type=recovery') || (hash.includes('access_token') && !hash.includes('error'))) {
            switchSection('new-password');
            showAlert("Vous pouvez définir un nouveau mot de passe.", "success", "unlock");
        } else if (hash.includes('error=access_denied') || hash.includes('error_description')) {
            switchSection('reset-request');
            showAlert("Ce lien a expiré. Demandez un nouveau lien ci-dessous.", "error", "alert-circle");
        }
    };

    // --- 1. CONNEXION ---
    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true, 'btn-login');

        const { error } = await sb.auth.signInWithPassword({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        });

        if (error) {
            showAlert("Email ou mot de passe incorrect.", "error", "alert-circle");
            setLoading(false, 'btn-login', 'Se connecter <i data-lucide="arrow-right" size="16"></i>');
        } else {
            window.location.href = '/admin/';
        }
    });

    // --- 2. DEMANDE DE RESET ---
    document.getElementById('form-reset-request').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true, 'btn-reset');
        const email = document.getElementById('reset-email').value;

        const { error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + window.location.pathname,
        });

        if (error) {
            showAlert("Erreur : " + error.message, "error", "alert-circle");
            setLoading(false, 'btn-reset', 'Envoyer le lien <i data-lucide="mail" size="16"></i>');
        } else {
            showAlert("Lien envoyé ! Vérifiez vos spams.", "success", "check-circle");
            document.getElementById('form-reset-request').reset();
            setLoading(false, 'btn-reset', 'Envoyer le lien <i data-lucide="mail" size="16"></i>');
        }
    });

    // --- 3. SAUVEGARDE NOUVEAU MDP ---
    document.getElementById('form-new-password').addEventListener('submit', async (e) => {
        e.preventDefault();
        setLoading(true, 'btn-new-pwd');

        const { error } = await sb.auth.updateUser({
            password: document.getElementById('new-password').value
        });

        if (error) {
            const msg = (error.message.includes('expired') || error.message.includes('invalid') || error.message.includes('session'))
                ? "Ce lien a expiré. Demandez un nouveau lien de réinitialisation."
                : "Erreur technique. Veuillez réessayer.";
            showAlert(msg, "error", "alert-circle");
            setLoading(false, 'btn-new-pwd', 'Sauvegarder <i data-lucide="check" size="16"></i>');
        } else {
            showAlert("Mot de passe changé ! Redirection...", "success", "check-circle");
            setTimeout(() => window.location.href = '/admin/', 1500);
        }
    });

    // --- UTILITAIRES ---
    window.switchSection = (id) => {
        ['login', 'reset-request', 'new-password'].forEach(s => {
            document.getElementById('section-' + s).classList.add('hidden');
        });
        document.getElementById('section-' + id).classList.remove('hidden');
        const alertBox = document.getElementById('alert-box');
        alertBox.classList.add('hidden');
        alertBox.style.display = 'none';
    }

    function showAlert(msg, type, iconName) {
        const el = document.getElementById('alert-box');
        el.innerHTML = `<i data-lucide="${iconName}" size="18"></i> ${msg}`;
        el.className = `alert ${type}`;
        el.style.display = 'flex';
        lucide.createIcons();
    }

    function setLoading(isLoading, btnId, defaultHTML = '') {
        const btn = document.getElementById(btnId);
        if (isLoading) {
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="spin"></i> Chargement...`;
        } else {
            btn.disabled = false;
            btn.innerHTML = defaultHTML;
        }
        lucide.createIcons();
    }
</script>
</body>
</html>
