<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Enseignements</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=9" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer data-domain="tristan-arbona.corpusdigitalis.com" src="https://stats.corpusdigitalis.com/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script>

    <style>
        .page-title { text-align: center; font-size: 2.5rem; margin-top: 0; margin-bottom: 0.5rem; color: #1a1a1a; }
        .intro-text { text-align: center; margin-bottom: 3rem; color: #555; font-size: 1.1rem; line-height: 1.6; min-height: 1.6rem; }
        
        .course-card { background: white; border-radius: 12px; border: 1px solid #e0e0e0; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02); }
        .course-header { background: #fefaf5; padding: 20px 25px; border-bottom: 1px solid transparent; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s ease, border-color 0.3s ease; user-select: none; }
        .course-header:hover { background: #f5f0ea; }
        .course-header.open { border-bottom-color: #e0e0e0; }

        .course-title-wrap { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .course-title { font-size: 1.3rem; color: #1a1a1a; margin: 0; line-height: 1.3; }
        .course-badge { background: #1a1a1a; color: white; padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; letter-spacing: 0.05em; }

        .course-body { padding: 10px 25px 25px 25px; background: #fff; }
        .section-card { border: 1px solid #f0f0f0; border-radius: 8px; margin-top: 15px; overflow: hidden; }
        .section-header { padding: 15px 20px; background: #fafafa; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s ease; user-select: none; }
        .section-header:hover { background: #f1f1f1; }
        .section-header.open { border-bottom: 1px solid #f0f0f0; }
        .section-title { font-size: 1.05rem; font-weight: 600; color: #333; margin: 0; }
        .section-body { padding: 15px 20px; background: #fff; }

        .accordion-grid { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s ease-out; }
        .accordion-grid.open { grid-template-rows: 1fr; }
        .accordion-inner { overflow: hidden; }

        .chevron { transition: transform 0.35s ease; color: #888; transform-origin: center; }
        .course-header.open .chevron, .section-header.open .chevron { transform: rotate(180deg); color: #1a1a1a; }

        .resource-links { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
        .resource-links li a { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; text-decoration: none; color: #1a1a1a; transition: transform 0.2s ease, border-color 0.2s ease; }
        .resource-links li a:hover { border-color: #1a1a1a; transform: translateX(5px); }
        .empty-msg { text-align: center; color: #888; font-style: italic; margin-top: 4rem; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="site-name no-animation" style="cursor: default;">
                <span id="skeleton-name" class="skeleton-box skeleton-glass" style="width: 140px; height: 24px; border-radius: 4px;"></span>
                <span id="real-site-name" style="display: none;"></span>
            </a>
            <div class="dynamic-nav" id="header-menu"></div>
        </nav>
    </header>

    <div class="container">
        <div style="width: 100%; max-width: 900px; margin: 0 auto;">
            <h1 class="page-title">Enseignements</h1>
            
            <p class="intro-text" id="desc-wrapper">
                <span id="skeleton-desc" class="skeleton-box" style="width: 250px; height: 1.1rem; max-width: 80%;"></span>
                <span id="page-desc" style="display: none;"></span>
            </p>

            <div id="courses-container">
                <div id="skeleton-courses-content">
                    <div class="course-card" style="box-shadow: none;">
                        <div class="course-header" style="cursor: default;">
                            <div class="course-title-wrap">
                                <div class="skeleton-box" style="width: 180px; height: 28px;"></div>
                                <div class="skeleton-box" style="width: 75px; height: 32px; border-radius: 6px;"></div>
                            </div>
                            <div class="skeleton-box" style="width: 24px; height: 24px; border-radius: 4px;"></div>
                        </div>
                    </div>
                    <div class="course-card" style="box-shadow: none;">
                        <div class="course-header" style="cursor: default;">
                            <div class="course-title-wrap">
                                <div class="skeleton-box" style="width: 220px; height: 28px;"></div>
                                <div class="skeleton-box" style="width: 75px; height: 32px; border-radius: 6px;"></div>
                            </div>
                            <div class="skeleton-box" style="width: 24px; height: 24px; border-radius: 4px;"></div>
                        </div>
                    </div>
                    <div class="course-card" style="box-shadow: none;">
                        <div class="course-header" style="cursor: default;">
                            <div class="course-title-wrap">
                                <div class="skeleton-box" style="width: 140px; height: 28px;"></div>
                                <div class="skeleton-box" style="width: 75px; height: 32px; border-radius: 6px;"></div>
                            </div>
                            <div class="skeleton-box" style="width: 24px; height: 24px; border-radius: 4px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links" id="footer-list"></div>
        <div class="corpus-tm">™ CorpusDigitalis</div>
    </footer>

    <script type="module">
        import { initLayout, supabase } from './theme.js';
        
        window.toggleAccordion = function(headerEl, bodyId) {
            const bodyEl = document.getElementById(bodyId);
            headerEl.classList.toggle('open'); bodyEl.classList.toggle('open');
        };

        async function loadCourses() {
            const prof = await initLayout();
            if (!prof) return;

            const skelName = document.getElementById('skeleton-name');
            if (skelName) skelName.style.display = 'none';

            const realNameEl = document.getElementById('real-site-name');
            if (realNameEl) {
                realNameEl.innerText = prof.name;
                realNameEl.style.display = 'inline';
            }

            const descSkeleton = document.getElementById('skeleton-desc');
            const descReal = document.getElementById('page-desc');
            const descWrapper = document.getElementById('desc-wrapper');
            
            if(prof.courses_desc) {
                if(descSkeleton) descSkeleton.style.display = 'none';
                if(descReal) {
                    descReal.innerText = prof.courses_desc;
                    descReal.style.display = 'inline';
                }
            } else {
                if(descWrapper) descWrapper.style.display = 'none';
            }

            const { data: courses, error } = await supabase.from('courses').select('*').eq('prof_id', prof.id).order('position', { ascending: true }).order('created_at', { ascending: false });
            const container = document.getElementById('courses-container');

            if (error || !courses || courses.length === 0) {
                if(container) container.innerHTML = "<p class='empty-msg'>Aucun enseignement disponible pour le moment.</p>"; 
                return;
            }
            
            if(container) container.innerHTML = "";
            
            courses.forEach((course) => {
                const sections = course.sections || []; 
                let sectionsHtml = '';
                sections.forEach((sec, secIdx) => {
                    let itemsHtml = '';
                    if(sec.items && sec.items.length > 0) {
                        itemsHtml = sec.items.map(item => `<li><a href="${item.value}" target="_blank"><i data-lucide="${item.type === 'file' ? 'file-text' : 'link'}" size="18"></i> ${item.label}</a></li>`).join('');
                    } else {
                        itemsHtml = '<li style="color:#888; font-size:0.9rem; padding-left: 10px;">Aucun document dans cette section.</li>';
                    }
                    sectionsHtml += `<div class="section-card"><div class="section-header" onclick="toggleAccordion(this, 'sec-body-${course.id}-${secIdx}')"><h3 class="section-title">${sec.title}</h3><i data-lucide="chevron-down" class="chevron"></i></div><div class="accordion-grid" id="sec-body-${course.id}-${secIdx}"><div class="accordion-inner"><div class="section-body"><ul class="resource-links">${itemsHtml}</ul></div></div></div></div>`;
                });
                container.innerHTML += `<div class="course-card"><div class="course-header" onclick="toggleAccordion(this, 'course-body-${course.id}')"><div class="course-title-wrap"><h2 class="course-title">${course.title}</h2><span class="course-badge">${course.category || 'Cours'}</span></div><i data-lucide="chevron-down" class="chevron"></i></div><div class="accordion-grid" id="course-body-${course.id}"><div class="accordion-inner"><div class="course-body">${sectionsHtml || '<p style="color:#888; margin:0;">Contenu en construction.</p>'}</div></div></div></div>`;
            });
            if(window.lucide) lucide.createIcons();
        }
        loadCourses();
    </script>
</body>
</html>
