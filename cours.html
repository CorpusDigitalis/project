<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Enseignements</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <script defer data-domain="tristan-arbona.corpusdigitalis.com" src="https://stats.corpusdigitalis.com/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script>

    <style>
        /* Styles spécifiques aux cours (adaptés au nouveau design) */
        .page-title {
            text-align: center;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 3rem;
            color: #1a1a1a;
        }

        .course-card {
            background: white; 
            border-radius: 12px; 
            border: 1px solid #e0e0e0; 
            margin-bottom: 30px; 
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .course-header {
            background: #fefaf5; /* Rappel élégant du fond de page */
            padding: 20px 25px; 
            border-bottom: 1px solid #e0e0e0;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .course-title { 
            font-size: 1.4rem; 
            color: #1a1a1a; 
            margin: 0; 
        }

        .course-badge { 
            background: #1a1a1a; 
            color: white; 
            padding: 5px 12px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            letter-spacing: 0.05em;
        }
        
        .section-list { padding: 25px; }
        .section-item { margin-bottom: 30px; }
        .section-item:last-child { margin-bottom: 0; }
        
        .section-title { 
            font-size: 1.1rem; 
            color: #333; 
            margin-bottom: 15px; 
            border-bottom: 1px solid #f0f0f0; 
            padding-bottom: 8px;
        }
        
        .resource-links { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: grid; 
            gap: 12px; 
        }
        
        .resource-links li a {
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding: 12px 18px; 
            background: #fff; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px;
            text-decoration: none; 
            color: #1a1a1a; 
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        
        /* Effet élégant au survol d'un document */
        .resource-links li a:hover { 
            border-color: #1a1a1a; 
            transform: translateX(5px);
        }
        
        .empty-msg { 
            text-align: center; 
            color: #888; 
            font-style: italic; 
            margin-top: 4rem; 
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="site-name no-animation">...</a>
            <div class="dynamic-nav" id="header-menu"></div>
        </nav>
    </header>

    <div class="container">
        <div style="width: 100%; max-width: 900px; margin: 0 auto;">
            <h1 class="page-title">Enseignements</h1>
            
            <div id="courses-container">
                <p class="empty-msg">Chargement des enseignements...</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links" id="footer-list"></div>
        <div class="corpus-tm">™ CorpusDigitalis</div>
    </footer>

    <script type="module">
        import { initLayout, supabase } from './theme.js';

        async function loadCourses() {
            // 1. Initialise le Layout (Header, Footer, Titre, Couleur de fond...)
            const prof = await initLayout();
            if (!prof) return;

            // 2. Récupération des cours dans Supabase (Triés par position)
            const { data: courses, error } = await supabase
                .from('courses')
                .select('*')
                .eq('prof_id', prof.id)
                .order('position', { ascending: true })
                .order('created_at', { ascending: false });

            const container = document.getElementById('courses-container');

            if (error || !courses || courses.length === 0) {
                container.innerHTML = "<p class='empty-msg'>Aucun enseignement disponible pour le moment.</p>";
                return;
            }

            container.innerHTML = "";

            // 3. Génération des cartes de cours
            courses.forEach(course => {
                const sections = course.sections || []; 

                let sectionsHtml = '';
                sections.forEach(sec => {
                    let itemsHtml = '';
                    if(sec.items && sec.items.length > 0) {
                        itemsHtml = sec.items.map(item => `
                            <li>
                                <a href="${item.value}" target="_blank">
                                    <i data-lucide="${item.type === 'file' ? 'file-text' : 'link'}" size="18"></i>
                                    ${item.label}
                                </a>
                            </li>
                        `).join('');
                    } else {
                        itemsHtml = '<li style="color:#888; font-size:0.9rem; padding-left: 10px;">Aucun document.</li>';
                    }

                    sectionsHtml += `
                        <div class="section-item">
                            <div class="section-title">${sec.title}</div>
                            <ul class="resource-links">${itemsHtml}</ul>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="course-card">
                        <div class="course-header">
                            <h2 class="course-title">${course.title}</h2>
                            <span class="course-badge">${course.category || 'Cours'}</span>
                        </div>
                        <div class="section-list">
                            ${sectionsHtml || '<p style="color:#888; margin:0;">Contenu en construction.</p>'}
                        </div>
                    </div>
                `;
            });
            
            // 4. Initialise les icônes Lucide une fois injectées dans le HTML
            lucide.createIcons();
        }

        loadCourses();
    </script>
</body>
</html>
