<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Publications</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Styles spécifiques aux publications */
        .intro-text { text-align: center; margin-bottom: 3rem; color: #64748b; font-size: 1.1rem; }
        
        .categorie-title {
            font-size: 1.5rem;
            margin-top: 4rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
            color: #0f172a;
            font-weight: 700;
        }

        .publication-item {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }
        .publication-item:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        .pub-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .pub-title { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
        .pub-date { font-size: 0.85rem; color: #64748b; background: #f1f5f9; padding: 4px 8px; border-radius: 4px; }
        
        .pub-desc { color: #475569; line-height: 1.6; margin-bottom: 15px; }
        
        .pub-link { 
            display: inline-flex; align-items: center; gap: 6px;
            text-decoration: none; color: white; background: #0f172a; 
            padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; transition: 0.2s; 
        }
        .pub-link:hover { background: #334155; }

        .empty-msg { text-align: center; color: #94a3b8; font-style: italic; margin-top: 4rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="header-logo">MON SITE</div>
        <nav>
            <ul id="header-menu" class="dynamic-nav"></ul>
        </nav>
    </header>

    <div class="container">
        <div style="width: 100%;">
            <h1 style="text-align: center; margin-bottom: 1rem;">Publications</h1>
            <p class="intro-text">Travaux de recherche, articles et ouvrages.</p>
            
            <div id="publications-container">
                <p class="empty-msg">Chargement...</p>
            </div>
        </div>
    </div>

    <footer>
        <p>© <span id="current-year"></span> <span id="footer-name"></span></p>
        <nav>
            <ul id="footer-menu" class="dynamic-nav"></ul>
        </nav>
    </footer>

    <script>
        const SUPABASE_URL = 'https://recgvfcuxsonkhlyctrw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MS-dVMY2bgi4ljM4tDTIdg_t4YKb80o';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function init() {
            // 1. Gestion URL ?prof=...
            const params = new URLSearchParams(window.location.search);
            const profParam = params.get('prof');
            if (!profParam) { document.body.innerHTML = "<div style='padding:50px;text-align:center;'>Profil introuvable.</div>"; return; }

            // 2. Récupération Profil + Publications
            let query = sb.from('profiles').select('*, publications(*)');
            const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(profParam);
            query = isUUID ? query.eq('id', profParam) : query.eq('slug', profParam);

            const { data: profile, error } = await query.single();

            if (error || !profile) {
                document.body.innerHTML = "<div style='padding:50px;text-align:center;'>Profil introuvable.</div>";
                return;
            }

            // 3. Identité
            document.title = `Publications - ${profile.name}`;
            document.getElementById('header-logo').textContent = (profile.name || "Site").toUpperCase();
            document.getElementById('footer-name').textContent = profile.name;
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // 4. Menus (Logique Admin V22)
            const pLink = `?prof=${profParam}`;
            const conf = profile.config || {};
            
            // Header
            const h = conf.header || {};
            let hHtml = '';
            if (h.home) hHtml += `<li><a href="index.html${pLink}">Accueil</a></li>`;
            if (h.publications) hHtml += `<li><a href="publications.html${pLink}" style="color:white;">Publications</a></li>`;
            if (h.courses) hHtml += `<li><a href="cours.html${pLink}">Enseignements</a></li>`;
            if (h.interventions) hHtml += `<li><a href="interventions.html${pLink}">Interventions</a></li>`;
            document.getElementById('header-menu').innerHTML = hHtml;

            // Footer
            const f = conf.footer || {};
            let fHtml = '';
            if (f.linkedin && profile.linkedin_url) fHtml += `<li><a href="${profile.linkedin_url}" target="_blank"><i data-lucide="linkedin"></i></a></li>`;
            if (f.scholar && profile.scholar_url) fHtml += `<li><a href="${profile.scholar_url}" target="_blank"><i data-lucide="graduation-cap"></i></a></li>`;
            if (f.cv && profile.cv_url) fHtml += `<li><a href="${profile.cv_url}" target="_blank"><i data-lucide="file-text"></i></a></li>`;
            document.getElementById('footer-menu').innerHTML = fHtml;
            lucide.createIcons();

            // 5. Affichage des Publications
            const container = document.getElementById('publications-container');
            const pubs = profile.publications || [];

            if (pubs.length === 0) {
                container.innerHTML = "<p class='empty-msg'>Aucune publication pour le moment.</p>";
                return;
            }

            // Tri par date
            pubs.sort((a, b) => new Date(b.date) - new Date(a.date));

            // Groupement
            const groupes = pubs.reduce((acc, pub) => {
                const cat = pub.category || "Autres";
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(pub);
                return acc;
            }, {});

            container.innerHTML = "";

            for (const [cat, items] of Object.entries(groupes)) {
                const h2 = document.createElement('h2');
                h2.className = 'categorie-title';
                h2.textContent = cat;
                container.appendChild(h2);

                items.forEach(pub => {
                    const div = document.createElement('div');
                    div.className = 'publication-item';
                    
                    let linkHtml = '';
                    if (pub.link_value) {
                        const icon = pub.link_type === 'file' ? 'file-text' : 'external-link';
                        const label = pub.link_type === 'file' ? 'Télécharger PDF' : 'Voir le document';
                        linkHtml = `<a href="${pub.link_value}" target="_blank" class="pub-link"><i data-lucide="${icon}" size="16"></i> ${label}</a>`;
                    }

                    div.innerHTML = `
                        <div class="pub-header">
                            <span class="pub-title">${pub.title || 'Sans titre'}</span>
                            ${pub.date ? `<span class="pub-date">${new Date(pub.date).toLocaleDateString('fr-FR')}</span>` : ''}
                        </div>
                        <p class="pub-desc">${pub.description || ''}</p>
                        ${linkHtml}
                    `;
                    container.appendChild(div);
                });
            }
            lucide.createIcons();
        }

        init();
    </script>
</body>
</html>
