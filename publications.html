<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Publications</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script defer data-domain="tristan-arbona.corpusdigitalis.com" src="https://stats.corpusdigitalis.com/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script>

    <style>
        /* Styles spécifiques aux publications */
        .page-title {
            text-align: center;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .intro-text { 
            text-align: center; 
            margin-bottom: 3rem; 
            color: #555; 
            font-size: 1.1rem; 
        }
        
        .categorie-title {
            font-size: 1.5rem;
            margin-top: 4rem;
            margin-bottom: 1.5rem;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
            color: #1a1a1a;
        }

        /* Cartes de publication adoucies pour matcher avec le fond #fefaf5 */
        .publication-item {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .publication-item:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05); 
        }
        
        .pub-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 12px; 
            flex-wrap: wrap; 
            gap: 10px; 
        }
        
        .pub-title { 
            font-size: 1.15rem; 
            color: #1a1a1a; 
            font-weight: bold;
        }
        
        .pub-date { 
            font-size: 0.85rem; 
            color: #555; 
            background: #f5f0ea; 
            padding: 5px 10px; 
            border-radius: 6px; 
            letter-spacing: 0.05em;
        }
        
        .pub-desc { 
            color: #444; 
            line-height: 1.6; 
            margin-bottom: 20px; 
        }
        
        .pub-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            text-decoration: none; 
            color: white; 
            background: #1a1a1a; 
            padding: 10px 18px; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            transition: transform 0.2s ease, background 0.2s ease; 
        }
        
        .pub-link:hover { 
            background: #333; 
            transform: scale(0.97);
        }

        .empty-msg { 
            text-align: center; 
            color: #888; 
            font-style: italic; 
            margin-top: 4rem; 
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="site-name no-animation">...</a>
            <div class="dynamic-nav" id="header-menu"></div>
        </nav>
    </header>

    <div class="container">
        <div style="width: 100%; max-width: 900px; margin: 0 auto;">
            <h1 class="page-title">Publications</h1>
            <p class="intro-text">Travaux de recherche, articles et ouvrages.</p>
            
            <div id="publications-container">
                <p class="empty-msg">Chargement des publications...</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links" id="footer-list"></div>
        <div class="corpus-tm">™ CorpusDigitalis</div>
    </footer>

    <script type="module">
        import { initLayout, supabase } from './theme.js';

        async function loadPublications() {
            // 1. Initialise le Layout (Header, Footer, Titre, Couleur de fond...)
            const prof = await initLayout();
            if (!prof) return;

            // 2. Récupération des publications
            const { data: pubs, error } = await supabase
                .from('publications')
                .select('*')
                .eq('prof_id', prof.id);

            const container = document.getElementById('publications-container');

            if (error || !pubs || pubs.length === 0) {
                container.innerHTML = "<p class='empty-msg'>Aucune publication disponible pour le moment.</p>";
                return;
            }

            // 3. Tri par date (de la plus récente à la plus ancienne)
            pubs.sort((a, b) => new Date(b.date) - new Date(a.date));

            // 4. Groupement par catégorie (Article, Ouvrage, etc.)
            const groupes = pubs.reduce((acc, pub) => {
                const cat = pub.category || "Autres";
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(pub);
                return acc;
            }, {});

            container.innerHTML = "";

            // 5. Génération dynamique de l'affichage
            for (const [cat, items] of Object.entries(groupes)) {
                // Titre de la catégorie
                const h2 = document.createElement('h2');
                h2.className = 'categorie-title';
                h2.textContent = cat;
                container.appendChild(h2);

                // Cartes des publications pour cette catégorie
                items.forEach(pub => {
                    const div = document.createElement('div');
                    div.className = 'publication-item';
                    
                    let linkHtml = '';
                    if (pub.link_value) {
                        const isFile = pub.link_type === 'file' || pub.link_value.includes('supabase.co');
                        const icon = isFile ? 'file-text' : 'external-link';
                        const label = isFile ? 'Télécharger le PDF' : 'Voir le document';
                        linkHtml = `<a href="${pub.link_value}" target="_blank" class="pub-link"><i data-lucide="${icon}" size="18"></i> ${label}</a>`;
                    }

                    // Formatage de la date à la française
                    const dateFormatted = pub.date ? new Date(pub.date).toLocaleDateString('fr-FR', { year: 'numeric', month: 'long' }) : '';

                    div.innerHTML = `
                        <div class="pub-header">
                            <span class="pub-title">${pub.title || 'Sans titre'}</span>
                            ${dateFormatted ? `<span class="pub-date">${dateFormatted}</span>` : ''}
                        </div>
                        <p class="pub-desc">${pub.description || ''}</p>
                        ${linkHtml}
                    `;
                    container.appendChild(div);
                });
            }

            // 6. Initialisation des icônes Lucide
            lucide.createIcons();
        }

        loadPublications();
    </script>
</body>
</html>
