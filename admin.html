<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Studio - DIAGNOSTIC</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; padding: 20px; color: #333; }
        .debug-box { background: #fee2e2; border: 2px solid #ef4444; color: #b91c1c; padding: 20px; margin-bottom: 20px; border-radius: 8px; font-family: monospace; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #1d4ed8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="debug-console" class="debug-box">
        <h3>🔧 CONSOLE DE DIAGNOSTIC</h3>
        <p id="status-msg">Initialisation en cours...</p>
        <button onclick="forceLogout()">Forcer la Déconnexion (Reset)</button>
    </div>

    <div id="app-interface" class="hidden">
        <h1>Admin Panel (Mode Réparation)</h1>
        <p>Si vous voyez ceci, Supabase est connecté !</p>
        <hr>
        <div style="display:flex; gap:20px;">
            <div style="flex:1; background:white; padding:20px; border-radius:8px;">
                <h3>Profil</h3>
                <label>Nom :</label> <input type="text" id="field-name" style="padding:5px; width:100%;">
                <br><br>
                <button onclick="testSave()">Tester la Sauvegarde</button>
            </div>
        </div>
    </div>

<script>
    // 1. CONFIGURATION (GLOBAL VARIABLE)
    // Pas d'import module, on utilise l'objet global 'supabase'
    const SUPABASE_URL = 'https://recgvfcuxsonkhlyctrw.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlY2d2ZmN1eHNvbmtobHljdHJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MTY5OTAsImV4cCI6MjA4MjM5Mjk5MH0.NrEoz7TiMDShWJ1pb2jTHgnItJgSSh1SFb5Q2X7zsjE'; 
    
    let sbClient = null;
    let myUserId = null;

    // Fonction pour afficher les logs à l'écran
    function log(msg) {
        console.log(msg);
        const el = document.getElementById('status-msg');
        el.innerHTML += "<br>> " + msg;
    }

    async function initDiagnostic() {
        try {
            log("1. Vérification de la librairie Supabase...");
            if (typeof supabase === 'undefined') {
                throw new Error("La librairie Supabase ne s'est pas chargée. Vérifiez votre connexion internet.");
            }
            
            log("2. Connexion au client...");
            sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            log("3. Vérification de la session utilisateur...");
            const { data, error } = await sbClient.auth.getSession();
            
            if (error) throw error;

            if (!data.session) {
                log("❌ AUCUNE SESSION TROUVÉE.");
                log("👉 Redirection vers login.html dans 3 secondes...");
                setTimeout(() => { window.location.href = 'login.html'; }, 3000);
                return;
            }

            myUserId = data.session.user.id;
            log("✅ Session OK ! User ID: " + myUserId);

            log("4. Tentative de récupération du profil...");
            const { data: profile, error: profError } = await sbClient
                .from('profiles')
                .select('*')
                .eq('id', myUserId);

            if (profError) {
                log("❌ Erreur accès Database: " + profError.message);
                log("Vérifiez vos règles RLS (Row Level Security) sur Supabase.");
            } else if (profile.length === 0) {
                log("⚠️ Profil introuvable pour cet ID.");
            } else {
                log("✅ Données récupérées avec succès !");
                log("Nom trouvé : " + profile[0].name);
                
                // Tout est OK, on affiche l'interface
                document.getElementById('debug-console').style.display = 'none';
                document.getElementById('app-interface').classList.remove('hidden');
                document.getElementById('field-name').value = profile[0].name || '';
            }

        } catch (err) {
            log("❌ ERREUR CRITIQUE : " + err.message);
            alert("Erreur critique : " + err.message);
        }
    }

    // Fonctions de test simples
    window.testSave = async () => {
        const newName = document.getElementById('field-name').value;
        const { error } = await sbClient.from('profiles').update({ name: newName }).eq('id', myUserId);
        if(error) alert("Erreur sauvegarde : " + error.message);
        else alert("Sauvegarde RÉUSSIE ! La connexion fonctionne.");
    }

    window.forceLogout = async () => {
        if(sbClient) await sbClient.auth.signOut();
        window.location.href = 'login.html';
    }

    // Lancement
    initDiagnostic();

</script>
</body>
</html>
