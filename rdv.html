<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rendez-vous</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .rdv-card {
            background: white; max-width: 500px; margin: 4rem auto; padding: 3rem;
            border-radius: 12px; border: 1px solid #e2e8f0; text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .rdv-title { font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem; }
        .rdv-text { color: #64748b; margin-bottom: 2rem; line-height: 1.6; }
        
        .rdv-btn-large {
            display: inline-block; background: #0f172a; color: white;
            padding: 15px 30px; border-radius: 8px; font-weight: 600; font-size: 1.1rem;
            text-decoration: none; transition: 0.2s;
        }
        .rdv-btn-large:hover { background: #334155; transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="header-logo">MON SITE</div>
        <nav>
            <ul id="header-menu" class="dynamic-nav"></ul>
        </nav>
    </header>

    <div class="container">
        <div class="rdv-card">
            <h1 class="rdv-title">Prendre rendez-vous</h1>
            <p class="rdv-text">Consultez mes disponibilités et réservez un créneau directement en ligne.</p>
            <div id="rdv-action">
                Chargement...
            </div>
        </div>
    </div>

    <footer>
        <p>© <span id="current-year"></span> <span id="footer-name"></span></p>
        <nav>
            <ul id="footer-menu" class="dynamic-nav"></ul>
        </nav>
    </footer>

    <script>
        const SUPABASE_URL = 'https://recgvfcuxsonkhlyctrw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MS-dVMY2bgi4ljM4tDTIdg_t4YKb80o';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const profParam = params.get('prof');
            if (!profParam) { document.body.innerHTML = "<div style='padding:50px;text-align:center;'>Profil introuvable.</div>"; return; }

            let query = sb.from('profiles').select('*');
            const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(profParam);
            query = isUUID ? query.eq('id', profParam) : query.eq('slug', profParam);

            const { data: profile, error } = await query.single();

            if (error || !profile) { document.body.innerHTML = "<div style='padding:50px;text-align:center;'>Profil introuvable.</div>"; return; }

            // Identité
            document.title = `Rendez-vous - ${profile.name}`;
            document.getElementById('header-logo').textContent = (profile.name).toUpperCase();
            document.getElementById('footer-name').textContent = profile.name;
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // Menu
            const pLink = `?prof=${profParam}`;
            const conf = profile.config || {};
            const h = conf.header || {};
            let hHtml = '';
            if (h.home) hHtml += `<li><a href="profil.html${pLink}">Accueil</a></li>`;
            if (h.publications) hHtml += `<li><a href="publications.html${pLink}">Publications</a></li>`;
            if (h.courses) hHtml += `<li><a href="cours.html${pLink}">Enseignements</a></li>`;
            if (h.interventions) hHtml += `<li><a href="interventions.html${pLink}">Interventions</a></li>`;
            document.getElementById('header-menu').innerHTML = hHtml;

            const f = conf.footer || {};
            let fHtml = '';
            if (f.linkedin && profile.linkedin_url) fHtml += `<li><a href="${profile.linkedin_url}" target="_blank"><i data-lucide="linkedin"></i></a></li>`;
            if (f.scholar && profile.scholar_url) fHtml += `<li><a href="${profile.scholar_url}" target="_blank"><i data-lucide="graduation-cap"></i></a></li>`;
            if (f.cv && profile.cv_url) fHtml += `<li><a href="${profile.cv_url}" target="_blank"><i data-lucide="file-text"></i></a></li>`;
            document.getElementById('footer-menu').innerHTML = fHtml;

            // Bouton RDV
            const actionBox = document.getElementById('rdv-action');
            if(profile.appointment_settings && profile.appointment_settings.url) {
                actionBox.innerHTML = `<a href="${profile.appointment_settings.url}" target="_blank" class="rdv-btn-large">${profile.appointment_settings.text || "Réserver un créneau"}</a>`;
            } else {
                actionBox.innerHTML = "<p style='color:#ef4444'>Aucun lien de rendez-vous configuré.</p>";
            }
            
            lucide.createIcons();
        }

        init();
    </script>
</body>
</html>
