<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chargement...</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <script defer data-domain="tristan-arbona.corpusdigitalis.com" src="https://stats.corpusdigitalis.com/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script>
</head>
<body>

  <header>
    <nav>
      <a href="#" class="site-name no-animation">...</a>
      
      <div class="dynamic-nav" id="header-menu"></div>
    </nav>
  </header>

  <div class="container">
    <div class="hero-section">
      
      <img id="profil-img" src="" alt="Portrait" style="display: none;" />
      
      <div class="description">
        <h1 id="main-title">Chargement...</h1>

        <p id="profil-desc">
          Chargement des informations du profil...
        </p>
      </div>

    </div>
  </div>

  <footer>
      <div class="footer-links" id="footer-list"></div>
      
      <div class="corpus-tm">™ CorpusDigitalis</div>
  </footer>

  <script type="module">
    import { initLayout } from './theme.js';

    async function loadHome() {
        const prof = await initLayout();
        if (!prof) return;

        // 1. Image
        const imgEl = document.getElementById('profil-img');
        if (prof.image_url) {
            imgEl.src = prof.image_url;
            imgEl.style.display = 'block';
        }

        // 2. Titre (en gras) personnalisé
        const titleEl = document.getElementById('main-title');
        if (prof.title) {
            titleEl.innerText = prof.title;
        } else {
            titleEl.innerText = prof.name; 
        }

        // 3. Bio : Utilisation de innerText (méthode la plus propre et sécurisée)
        const bioEl = document.getElementById('profil-desc');
        if (prof.bio) {
            bioEl.innerText = prof.bio;
        }
    }

    loadHome();
  </script>

</body>
</html>
