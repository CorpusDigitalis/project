<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chargement...</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
      <div class="logo site-name">...</div>
      
      <ul class="dynamic-nav" id="header-menu">
          </ul>
  </header>

  <div class="container">
    <div class="hero-section">
      
      <img id="profil-img" src="" alt="Portrait" />
      
      <div class="description">
        <h1 id="main-title" class="site-name">...</h1>

        <p id="profil-desc">
          Chargement...
        </p>
      </div>

    </div>
  </div>

  <footer>
      <ul class="dynamic-nav" id="footer-list">
          </ul>
  </footer>

  <script type="module">
    import { initLayout } from './theme.js';

    async function loadHome() {
        const prof = await initLayout();
        if (!prof) return;

        // 1. Image
        const imgEl = document.getElementById('profil-img');
        if (prof.image_url) {
            imgEl.src = prof.image_url;
        } else {
            imgEl.style.display = 'none';
        }

        // 2. Bio
        const bioEl = document.getElementById('profil-desc');
        if (prof.bio) {
            bioEl.innerHTML = prof.bio.replace(/\n/g, '<br>');
        }

        // Note : initLayout s'occupe déjà de remplir 
        // les menus (Header/Footer) et le Nom (site-name).
    }

    loadHome();
  </script>

</body>
</html>
