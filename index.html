<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chargement...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <header>
        <div class="logo" id="header-logo">MON SITE</div>
        <nav>
            <ul id="header-menu" class="dynamic-nav">
                </ul>
        </nav>
    </header>

    <div class="container">
        <main class="hero-section">
            <img id="profil-img" src="" alt="Portrait" style="display:none;" /> <div class="description">
                <h1 id="profil-titre"></h1>
                <p id="profil-desc"></p>
                <div id="rdv-container"></div>
            </div>
        </main>
    </div>

    <footer>
        <p>© <span id="current-year"></span> <span id="footer-name"></span></p>
        <nav>
            <ul id="footer-menu" class="dynamic-nav">
                </ul>
        </nav>
    </footer>

    <script>
        // --- 1. CONFIGURATION ---
        const SUPABASE_URL = 'https://recgvfcuxsonkhlyctrw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MS-dVMY2bgi4ljM4tDTIdg_t4YKb80o'; // Clé publique OK
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 2. LOGIQUE PRINCIPALE ---
        async function loadSite() {
            // Récupérer le paramètre 'prof' (soit un ID, soit un SLUG)
            const params = new URLSearchParams(window.location.search);
            const profParam = params.get('prof');

            if (!profParam) {
                document.body.innerHTML = "<div style='padding:50px;text-align:center;'>Profil introuvable (URL incomplète).</div>";
                return;
            }

            // Stratégie : On essaie de trouver par ID d'abord (format UUID), sinon par Slug
            let query = sb.from('profiles').select('*');
            const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(profParam);

            if (isUUID) {
                query = query.eq('id', profParam);
            } else {
                query = query.eq('slug', profParam);
            }

            const { data: profile, error } = await query.single();

            if (error || !profile) {
                console.error("Erreur:", error);
                document.body.innerHTML = "<div style='padding:50px;text-align:center;'>Ce profil n'existe pas encore.</div>";
                return;
            }

            // --- 3. INJECTION DES DONNÉES ---
            document.title = profile.name || "Site Personnel";
            document.getElementById('header-logo').textContent = (profile.name || "Mon Site").toUpperCase();
            document.getElementById('footer-name').textContent = profile.name;
            document.getElementById('current-year').textContent = new Date().getFullYear();

            document.getElementById('profil-titre').textContent = profile.name || "Bienvenue";
            document.getElementById('profil-desc').textContent = profile.bio || "Biographie non renseignée.";
            
            // Image
            const img = document.getElementById('profil-img');
            if (profile.image_url) {
                img.src = profile.image_url;
                img.style.display = 'block';
            } else {
                // Placeholder si pas d'image
                img.style.display = 'none'; 
            }

            // Bouton RDV
            if (profile.appointment_settings && profile.appointment_settings.url) {
                const btn = document.getElementById('rdv-container');
                btn.innerHTML = `<a href="${profile.appointment_settings.url}" target="_blank" class="rdv-button">${profile.appointment_settings.text || "Prendre rendez-vous"}</a>`;
            }

            // --- 4. CONSTRUCTION DES MENUS (Basé sur CONFIG de l'admin) ---
            const config = profile.config || {}; 
            const hConfig = config.header || {};
            const fConfig = config.footer || {};

            // MENU HEADER
            const hMenu = document.getElementById('header-menu');
            let hHtml = '';
            // On ajoute l'ID/Slug dans les liens pour garder la navigation fluide
            const pLink = `?prof=${profParam}`; 

            if (hConfig.home) hHtml += `<li><a href="index.html${pLink}">Accueil</a></li>`;
            if (hConfig.publications) hHtml += `<li><a href="publications.html${pLink}">Publications</a></li>`;
            if (hConfig.courses) hHtml += `<li><a href="cours.html${pLink}">Enseignements</a></li>`;
            if (hConfig.interventions) hHtml += `<li><a href="interventions.html${pLink}">Interventions</a></li>`;
            
            hMenu.innerHTML = hHtml;

            // MENU FOOTER (Icônes)
            const fMenu = document.getElementById('footer-menu');
            let fHtml = '';

            if (fConfig.linkedin && profile.linkedin_url) {
                fHtml += `<li><a href="${profile.linkedin_url}" target="_blank" title="LinkedIn"><i data-lucide="linkedin"></i></a></li>`;
            }
            if (fConfig.scholar && profile.scholar_url) {
                fHtml += `<li><a href="${profile.scholar_url}" target="_blank" title="Google Scholar"><i data-lucide="graduation-cap"></i></a></li>`;
            }
            if (fConfig.cv && profile.cv_url) {
                fHtml += `<li><a href="${profile.cv_url}" target="_blank" title="Télécharger CV"><i data-lucide="file-text"></i></a></li>`;
            }
            // Liens custom footer
            if (fConfig.custom && fConfig.custom.length > 0) {
                fConfig.custom.forEach(link => {
                    fHtml += `<li><a href="${link.url}" target="_blank">${link.label}</a></li>`;
                });
            }

            fMenu.innerHTML = fHtml;
            lucide.createIcons();
        }

        loadSite();
    </script>
</body>
</html>
